name: Fetch SSL Certificate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL or domain (e.g., example.com)'
        required: true
        default: ''
        type: string
      cert_type:
        description: 'Certificate type to download'
        required: true
        default: 'leaf'
        type: choice
        options:
          - leaf
          - chain
          - split

jobs:
  get-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract domain name from input
        id: parse_url
        run: |
          CLEAN_URL="${{ inputs.target_url }}"
          CLEAN_URL="${CLEAN_URL#*://}"
          CLEAN_URL="${CLEAN_URL%%/*}"
          echo "domain=$CLEAN_URL" >> $GITHUB_OUTPUT
          echo "Resolved Domain: $CLEAN_URL"

      - name: Fetch and Print SSL certificate
        run: |
          DOMAIN="${{ steps.parse_url.outputs.domain }}"
          TYPE="${{ inputs.cert_type }}"
          echo "Fetching $TYPE certificate(s) for $DOMAIN..."
          
          mkdir -p cert-output
          
          # Extract only valid certificate text blocks directly from the server handshake, omitting logs
          openssl s_client -showcerts -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > raw_chain.pem
          
          if [ ! -s raw_chain.pem ]; then
            echo "Error: Failed to retrieve certificate payload from $DOMAIN"
            exit 1
          fi

          if [ "$TYPE" == "leaf" ]; then
            echo "========================================="
            echo "LEAF CERTIFICATE (${DOMAIN}.crt)"
            echo "========================================="
            awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag; /-----END CERTIFICATE-----/{flag=0; exit}' raw_chain.pem
            
          elif [ "$TYPE" == "chain" ]; then
            echo "========================================="
            echo "FULL CHAIN CERTIFICATE (${DOMAIN}-full-chain.crt)"
            echo "========================================="
            cat raw_chain.pem
            
          elif [ "$TYPE" == "split" ]; then
            awk 'n==0 {n=1; print > "cert-output/'"${DOMAIN}"'-cert-"++c ".crt"} /-----END CERTIFICATE-----/ {n=0}' raw_chain.pem
            
            for f in cert-output/*.crt; do
              echo "========================================="
              echo "FILE: $(basename "$f")"
              echo "========================================="
              cat "$f"
              echo ""
            done
          fi
