name: Fetch SSL Certificate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL or domain (e.g., example.com)'
        required: true
        default: ''
        type: string
      cert_type:
        description: 'Certificate type to download'
        required: true
        default: 'leaf'
        type: choice
        options:
          - leaf
          - chain
          - split

jobs:
  get-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract domain name from input
        id: parse_url
        run: |
          CLEAN_URL="${{ inputs.target_url }}"
          CLEAN_URL="${CLEAN_URL#*://}"
          CLEAN_URL="${CLEAN_URL%%/*}"
          echo "domain=$CLEAN_URL" >> $GITHUB_OUTPUT
          echo "Resolved Domain: $CLEAN_URL"

      - name: Fetch SSL certificate
        run: |
          DOMAIN="${{ steps.parse_url.outputs.domain }}"
          TYPE="${{ inputs.cert_type }}"
          echo "Fetching $TYPE certificate(s) for $DOMAIN..."
          
          mkdir -p cert-output
          
          if [ "$TYPE" == "leaf" ]; then
            openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null | openssl x509 -outform PEM > "cert-output/${DOMAIN}.crt"
          elif [ "$TYPE" == "chain" ]; then
            openssl s_client -showcerts -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null | openssl x509 -outform PEM > "cert-output/${DOMAIN}-full-chain.crt"
          elif [ "$TYPE" == "split" ]; then
            openssl s_client -showcerts -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null > full_chain.pem
            awk 'n==0 {n=1;print > "cert-output/'"${DOMAIN}"'-cert-"++c ".crt"} /-----END CERTIFICATE-----/ {n=0}' full_chain.pem
          fi

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssl-certificate-${{ steps.parse_url.outputs.domain }}
          path: cert-output/*
