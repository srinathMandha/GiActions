name: Fetch SSL Certificate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL or domain (e.g., example.com)'
        required: true
        default: ''
        type: string
      cert_type:
        description: 'Certificate type to download'
        required: true
        default: 'leaf'
        type: choice
        options:
          - leaf
          - chain
          - split

jobs:
  get-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract domain name from input
        id: parse_url
        run: |
          CLEAN_URL="${{ inputs.target_url }}"
          CLEAN_URL="${CLEAN_URL#*://}"
          CLEAN_URL="${CLEAN_URL%%/*}"
          echo "domain=$CLEAN_URL" >> $GITHUB_OUTPUT
          echo "Resolved Domain: $CLEAN_URL"

      - name: Fetch and clean SSL certificate
        run: |
          DOMAIN="${{ steps.parse_url.outputs.domain }}"
          TYPE="${{ inputs.cert_type }}"
          echo "Fetching $TYPE certificate(s) for $DOMAIN..."
          
          mkdir -p cert-output
          
          # Extract only valid certificate text blocks directly from the server handshake, omitting all logs
          openssl s_client -showcerts -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > raw_chain.pem
          
          if [ ! -s raw_chain.pem ]; then
            echo "Error: Failed to retrieve certificate payload from $DOMAIN"
            exit 1
          fi

          if [ "$TYPE" == "leaf" ]; then
            # Output strictly the first leaf certificate content
            awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag; /-----END CERTIFICATE-----/{flag=0; exit}' raw_chain.pem > "cert-output/${DOMAIN}.crt"
            
          elif [ "$TYPE" == "chain" ]; then
            # Output the full chain containing only certificate blocks
            cp raw_chain.pem "cert-output/${DOMAIN}-full-chain.crt"
            
          elif [ "$TYPE" == "split" ]; then
            # Split each layer into independent .crt files containing exclusively certificate content
            awk 'n==0 {n=1;print > "cert-output/'"${DOMAIN}"'-cert-"++c ".crt"} /-----END CERTIFICATE-----/ {n=0}' raw_chain.pem
          fi

      - name: Upload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssl-certificate-${{ steps.parse_url.outputs.domain }}
          path: cert-output/*
